{% set name = "eth-rlp" %}
{% set version = "3.0.0" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 9663e54a4a1c1c847d2d328c1d07e4174ec1c082953fbb42b60e61c501c4931c

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - setuptools
    - setuptools-scm
    - python {{ python_min }}
    - setuptools-markdown
  run:
    - python >={{ python_min }},<4.0
    - eth-utils >=2.0.0
    - hexbytes >=1.2.0
    - rlp >=0.6.0
    - typing_extensions >=4.0.1  # py<=3.10

test:
  imports:
    - eth_rlp
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/ethereum/eth-rlp
  summary: 'eth-rlp: RLP definitions for common Ethereum objects in Python'
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - step21
